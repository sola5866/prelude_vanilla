name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
        
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        
      - name: Sync dependencies
        run: uv sync
        
      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        
      - name: Run validation
        run: |
          uv run python tools/validate/validate.py
        
      - name: Build all addons
        run: |
          uv run python tools/build/build-all.py \
            --version "${{ steps.version.outputs.version }}"
        
      - name: Create Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Prelude Vanilla ${{ steps.version.outputs.version }}
          draft: true
          files: |
            dist/v${{ steps.version.outputs.version }}/*.mcpack
            dist/v${{ steps.version.outputs.version }}/build-report.json
